<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Feine Marmoradern wie auf dem Papier der echten Speisekarte -->
  <filter id="adern" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.013" numOctaves="4" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.25  1 0 0 0 0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0 0 0 .9 0 0 0 .5 0 0 0 0 0"/>
    </feComponentTransfer>
    <feGaussianBlur stdDeviation=".5"/>
  </filter>
  <filter id="wolken" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.50  0 0 0 0 0.36  1.4 0 0 0 -0.62"/>
  </filter>
  <rect width="600" height="600" filter="url(#wolken)" opacity=".24"/>
  <rect width="600" height="600" filter="url(#adern)" opacity=".22"/>
</svg>
